name: GNU du tests

# GNU coreutils' own tests/du, with fastdu in du's place (test/gnu-du.sh). A
# workflow of its own, so the README can show its status apart from the build.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gnu-du-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: make
      # move-dir-while-traversing.sh watches with pyinotify (Linux only), which
      # needs asyncore back on Python 3.12 and later. The bind-mount tests run
      # as root: the runner's sudo needs no password.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: pyinotify
        if: runner.os == 'Linux'
        run: python -m pip install pyinotify pyasyncore
      - name: GNU's du tests
        run: ./test/gnu-du.sh ./fastdu "$RUNNER_TEMP/gnu"
