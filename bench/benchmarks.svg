<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Files counted per second by fastdu and other disk-usage tools on Linux and Windows">
<style>
text { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
.title { font-size: 15px; font-weight: 600; }
.tick, .none { fill: #59636e; font-size: 11px; }
.grid { stroke: #d1d9e0; }
.linux { fill: #e95420; }
.windows { fill: #0078d4; }
@media (prefers-color-scheme: dark) {
  text { fill: #f0f6fc; }
  .tick, .none { fill: #9198a1; }
  .grid { stroke: #3d444d; }
}
</style>
<text class="title" x="16" y="24">Files counted per second (longer is faster)</text>
<rect class="linux" x="130" y="36" width="11" height="11"/><text x="146" y="46">Linux, a source tree (1.15 M files)</text>
<rect class="windows" x="380" y="36" width="11" height="11"/><text x="396" y="46">Windows, all of C:\ (1.86 M files)</text>
<line class="grid" x1="130" y1="60" x2="130" y2="446"/>
